[project]
name = "localhostairlines"
version = "0.1.0"
description = "Self-hosted flight intelligence platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.27",
    # Offline coordinate -> IANA timezone lookup, the fallback step of the
    # airport timezone resolution chain (docs/providers.md).
    "timezonefinder>=6.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]
# Only the scraper image installs this group — Chromium is heavy and has no
# reason to be dragged into api or worker (CLAUDE.md §6).
scraper = [
    "playwright>=1.48",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "domain*", "infrastructure*", "providers*", "normalization*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py313"
# docs/ holds illustrative pseudocode inside prose, not real source — ruff's
# markdown code-fence formatting would rewrap it as if it were, which fights
# the deliberate line breaks chosen for readability there.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = [
    "B008",  # Depends(...) as a default is the documented FastAPI pattern, not a bug
    "N818",  # our exceptions are named *Problem to match RFC 9457 / docs/api.md §4 vocabulary
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# domain/ is the pure layer (spec §5, CLAUDE.md §7): no I/O, no framework imports.
# It is held to a stricter bar than the rest of the codebase for exactly that reason.
module = "domain.*"
disallow_untyped_defs = true
disallow_any_generics = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio's default is a fresh event loop per test function, but the
# lru_cache-memoized engine/redis singletons (infrastructure/postgres/database.py,
# infrastructure/redis.py) are created once and bound to whichever loop was
# running the first time they were used — matching how the real app runs
# (one process, one loop). A per-test loop breaks that on the second test:
# "Event loop is closed" the moment a cached connection from test A is reused
# in test B's different loop. Scoping to "session" gives every test the same
# loop, matching production instead of fighting it.
asyncio_default_test_loop_scope = "session"
# Fixtures default to function-scoped loops independently of the test loop
# scope above — same mismatch, different knob. An autouse fixture using the
# same cached redis client hit "Event loop is closed" in its teardown until
# this was set too.
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires a live PostgreSQL reachable at DATABASE_URL",
    "contract: adapter contract test against a recorded fixture; never touches a real source (spec §21)",
]
